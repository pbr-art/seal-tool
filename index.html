<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b6cff">
<meta name="format-detection" content="telephone=no">
<!-- 放到网上之后，iPhone 用「添加到主屏幕」打开会像 App 一样全屏 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="印章排版">
<meta name="mobile-web-app-capable" content="yes">
<title>印章排版工具 · berry</title>
<style>
  :root {
    --line: #e3e6ea;
    --text: #22262b;
    --muted: #6b7280;
    --accent: #2b6cff;
    --accent-dark: #1f56cf;
    --bg: #f5f6f8;
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 16px/1.6 "Microsoft YaHei", "PingFang SC", "HarmonyOS Sans SC", "Segoe UI", sans-serif;
    padding-bottom: calc(88px + var(--safe-b));
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 680px; margin: 0 auto; padding: 18px 16px 24px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  .brand { min-width: 0; }
  h1 { font-size: 20px; margin: 0 0 3px; letter-spacing: .5px; }
  h2 { font-size: 15px; margin: 0 0 10px; }
  .sub { margin: 0; color: var(--muted); font-size: 13px; }
  .mark {
    flex: none; background: linear-gradient(135deg, #2b6cff, #7aa2ff); color: #fff;
    font-size: 18px; font-weight: 700; letter-spacing: 2px;
    padding: 11px 17px 11px 19px; border-radius: 999px;
    box-shadow: 0 6px 16px rgba(43, 108, 255, .32); user-select: none;
  }
  .corner-mark {
    position: fixed; right: 14px; bottom: calc(10px + var(--safe-b));
    color: var(--accent); opacity: .22; font-size: 20px; font-weight: 700;
    letter-spacing: 2px; pointer-events: none; user-select: none;
  }
  .card {
    background: #fff; border: 1px solid var(--line); border-radius: 14px;
    padding: 15px 16px; margin-bottom: 14px;
  }
  .hint { background: #eef4ff; border-color: #d6e3ff; color: #23458f; font-size: 13px; padding: 12px 14px; }
  .pick {
    display: block; text-align: center; border: 2px dashed #c3cad6; border-radius: 14px;
    padding: 26px 16px; background: #fcfdff; cursor: pointer;
  }
  .pick.hot { border-color: var(--accent); background: #f0f5ff; }
  .pick .big { font-size: 17px; font-weight: 600; }
  .pick .small { color: var(--muted); font-size: 13px; margin-top: 4px; }
  /* 隐形的文件输入：不要用 display:none，免得个别浏览器不认 label 的点击转发 */
  input[type="file"] {
    position: absolute; width: 1px; height: 1px; opacity: 0;
    overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%);
  }
  .thumbs { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
  .head-row { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; font-size: 14px; }
  .clear { border: none; background: none; color: var(--muted); font: inherit; font-size: 13px; text-decoration: underline; padding: 0; }
  .thumb {
    width: calc(33.33% - 7px); border: 1px solid var(--line); border-radius: 10px;
    padding: 5px; background: #fcfcfd; position: relative; text-align: center;
  }
  .thumb img { width: 100%; height: 72px; object-fit: contain; background: #fff; border-radius: 7px; }
  .thumb .name { font-size: 11px; color: var(--muted); margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .thumb .del {
    position: absolute; top: -8px; right: -8px; width: 24px; height: 24px; border-radius: 50%;
    border: none; background: #94a3b8; color: #fff; font-size: 15px; line-height: 24px; padding: 0;
  }
  .empty { color: #9aa3af; font-size: 14px; padding: 6px 2px; }
  .fields { display: flex; gap: 12px; flex-wrap: wrap; }
  .check {
    display: flex; align-items: flex-start; gap: 8px; margin-top: 12px;
    font-size: 13px; color: #374151; user-select: none;
  }
  .check input { width: 18px; height: 18px; margin: 1px 0 0; flex: none; accent-color: var(--accent); }
  .field { flex: 1 1 150px; }
  .field label { display: block; font-size: 13px; color: #374151; margin-bottom: 5px; }
  .field input {
    width: 100%; padding: 11px 12px; border: 1px solid var(--line); border-radius: 10px;
    font: inherit; font-size: 16px; background: #fff;
  }
  .field input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px #dbe6ff; }
  .stats { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 2px; }
  .stat { flex: 1 1 44%; background: #f7f9fc; border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; }
  .stat .k { font-size: 12px; color: var(--muted); }
  .stat .v { font-size: 18px; font-weight: 700; }
  .stat .v small { font-size: 12px; font-weight: 400; color: var(--muted); margin-left: 2px; }
  #previewImg {
    display: block; width: 100%; margin-top: 10px; background: #fff;
    border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 6px 16px rgba(15, 23, 42, .07);
  }
  .btn {
    display: block; width: 100%; font: inherit; font-size: 16px; font-weight: 600;
    padding: 13px 16px; border-radius: 12px; border: 1px solid var(--line);
    background: #fff; color: var(--text); margin-top: 10px;
  }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:active { background: var(--accent-dark); }
  .btn[disabled] { opacity: .55; }
  .tip { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 9;
    padding: 10px 16px calc(10px + var(--safe-b));
    background: rgba(245, 246, 248, .94); border-top: 1px solid var(--line);
  }
  .bar .inner { max-width: 680px; margin: 0 auto; display: flex; align-items: center; gap: 10px; }
  .bar .btn { margin: 0; flex: 1; }
  #status { font-size: 13px; color: var(--muted); min-width: 0; }
  #status.error { color: #d81f2a; }
  #status.ok { color: #12833b; }
  #status.warn { color: #b45309; }
  .hidden { display: none; }
  footer { text-align: center; color: #9aa3af; font-size: 12px; margin-top: 6px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <h1>印章排版工具</h1>
      <p class="sub">印章照片 → 黑白化 → Word 密排文档</p>
    </div>
    <div class="mark" title="berry">berry</div>
  </header>

  <div class="card hint">图片只在这台手机上处理，不上传、不联网。生成好的 Word 可以直接分享到微信。</div>

  <div class="card">
    <label class="pick" id="pick" for="file">
      <div class="big">＋ 拍照 / 从相册选择</div>
      <div class="small">支持 PNG / JPG / BMP / GIF，可一次选多张</div>
    </label>
    <input id="file" type="file" accept="image/*,.png,.jpg,.jpeg,.bmp,.gif" multiple>
    <div class="head-row">
      <div>已选图片<span class="pill" id="count" style="color:#1f56cf;font-size:13px">0 张</span></div>
      <button id="clear" class="clear" type="button">全部清空</button>
    </div>
    <div id="thumbs" class="thumbs"><div class="empty">还没有选择图片</div></div>
  </div>

  <div class="card">
    <h2>排版本数</h2>
    <div class="fields">
      <div class="field">
        <label for="sizes">尺寸档位（厘米）</label>
        <input id="sizes" type="text" value="1.5,2,2.5,3" inputmode="decimal" spellcheck="false">
      </div>
      <div class="field">
        <label for="copies">每档份数</label>
        <input id="copies" type="number" min="1" max="30" step="1" value="3" inputmode="numeric">
      </div>
    </div>
    <div class="tip">例：3 个印章 × 4 个档位 × 3 份 → 12 张单图，正好排满 1 页 A4。</div>
    <label class="check" for="autoCrop">
      <input id="autoCrop" type="checkbox" checked>
      <span>自动裁切到印章（大照片里的桌面、彩色背景、红色印刷字不会再被当成印章）</span>
    </label>
  </div>

  <div id="result" class="card hidden">
    <h2>处理完成</h2>
    <div id="stats" class="stats"></div>
    <div class="tip" id="settings"></div>
    <div class="tip" id="cropInfo"></div>
    <img id="previewImg" alt="排版预览">
    <button id="shareWord" class="btn primary" type="button">分享 / 保存 Word 文档</button>
    <button id="saveZip" class="btn" type="button">保存单图压缩包</button>
    <button id="savePreview" class="btn" type="button">保存预览图</button>
    <div class="tip" id="outHint"></div>
  </div>

  <footer>本工具完全在手机上运行，不联网。 · <strong>berry</strong></footer>
</div>

<div class="bar">
  <div class="inner">
    <button id="start" class="btn primary" type="button">开始处理</button>
    <span id="status"></span>
  </div>
</div>
<div class="corner-mark">berry</div>

<!-- ============ 1) 浏览器兼容层：把引擎用到的 Buffer / fs / path / zlib 做出来 ============ -->
<script>
(function () {
  "use strict";

  /* ------------------------------ Buffer ------------------------------ */
  const utf8Encoder = new TextEncoder();
  const utf8Decoder = new TextDecoder("utf-8");

  class Buf extends Uint8Array {
    static alloc(size, fill) {
      const buf = new Buf(size);
      if (fill !== undefined) buf.fill(fill);
      return buf;
    }
    static from(value, arg2, arg3) {
      if (typeof value === "string") return Buf.fromString(value, arg2);
      if (value instanceof ArrayBuffer) {
        const offset = arg2 || 0;
        const length = arg3 === undefined ? value.byteLength - offset : arg3;
        return new Buf(value, offset, length);
      }
      if (ArrayBuffer.isView(value)) {
        return new Buf(value.buffer.slice(value.byteOffset, value.byteOffset + value.byteLength));
      }
      if (Array.isArray(value)) return new Buf(value);
      throw new TypeError("Buffer.from: unsupported value");
    }
    static fromString(text, encoding) {
      const name = String(encoding || "utf8").toLowerCase();
      if (name === "utf8" || name === "utf-8") return new Buf(utf8Encoder.encode(text));
      if (name === "ascii" || name === "latin1" || name === "binary") {
        const buf = new Buf(text.length);
        for (let i = 0; i < text.length; i++) buf[i] = text.charCodeAt(i) & 0xff;
        return buf;
      }
      if (name === "hex") {
        const buf = new Buf(text.length >> 1);
        for (let i = 0; i < buf.length; i++) buf[i] = parseInt(text.substr(i * 2, 2), 16);
        return buf;
      }
      throw new Error("Buffer.from: unsupported encoding " + encoding);
    }
    static concat(list, totalLength) {
      let total = totalLength;
      if (total === undefined) {
        total = 0;
        for (const item of list) total += item.length;
      }
      const out = new Buf(total);
      let pos = 0;
      for (const item of list) {
        if (pos >= total) break;
        const chunk = item.length > total - pos ? item.subarray(0, total - pos) : item;
        out.set(chunk, pos);
        pos += chunk.length;
      }
      return out;
    }
    readUInt8(offset = 0) { return this[offset]; }
    readUInt16BE(offset = 0) { return (this[offset] << 8) | this[offset + 1]; }
    readUInt16LE(offset = 0) { return this[offset] | (this[offset + 1] << 8); }
    readUInt32BE(offset = 0) {
      return (this[offset] * 0x1000000 + (this[offset + 1] << 16) + (this[offset + 2] << 8) + this[offset + 3]) >>> 0;
    }
    readUInt32LE(offset = 0) {
      return (this[offset] + (this[offset + 1] << 8) + (this[offset + 2] << 16) + this[offset + 3] * 0x1000000) >>> 0;
    }
    writeUInt8(value, offset = 0) { this[offset] = value & 0xff; return offset + 1; }
    writeUInt16BE(value, offset = 0) {
      this[offset] = (value >>> 8) & 0xff;
      this[offset + 1] = value & 0xff;
      return offset + 2;
    }
    writeUInt16LE(value, offset = 0) {
      this[offset] = value & 0xff;
      this[offset + 1] = (value >>> 8) & 0xff;
      return offset + 2;
    }
    writeUInt32BE(value, offset = 0) {
      this[offset] = (value >>> 24) & 0xff;
      this[offset + 1] = (value >>> 16) & 0xff;
      this[offset + 2] = (value >>> 8) & 0xff;
      this[offset + 3] = value & 0xff;
      return offset + 4;
    }
    writeUInt32LE(value, offset = 0) {
      this[offset] = value & 0xff;
      this[offset + 1] = (value >>> 8) & 0xff;
      this[offset + 2] = (value >>> 16) & 0xff;
      this[offset + 3] = (value >>> 24) & 0xff;
      return offset + 4;
    }
    copy(target, targetStart = 0, sourceStart = 0, sourceEnd = this.length) {
      const chunk = this.subarray(sourceStart, sourceEnd);
      target.set(chunk, targetStart);
      return chunk.length;
    }
    toString(encoding, start, end) {
      const view = this.subarray(start || 0, end === undefined ? this.length : end);
      const name = String(encoding || "utf8").toLowerCase();
      if (name === "utf8" || name === "utf-8") return utf8Decoder.decode(view);
      if (name === "ascii" || name === "latin1" || name === "binary") {
        let text = "";
        for (let i = 0; i < view.length; i++) text += String.fromCharCode(view[i]);
        return text;
      }
      if (name === "hex") {
        let text = "";
        for (let i = 0; i < view.length; i++) text += view[i].toString(16).padStart(2, "0");
        return text;
      }
      throw new Error("Buffer.toString: unsupported encoding " + encoding);
    }
  }

  /* ------------------------------- path ------------------------------- */
  function cleanPath(input) {
    let text = String(input).replace(/\\/g, "/").replace(/\/{2,}/g, "/");
    if (text.length > 1) text = text.replace(/\/+$/, "");
    return text || "/";
  }
  const pathShim = {
    sep: "/",
    join(...parts) {
      return cleanPath(parts.filter((p) => p !== undefined && p !== null && p !== "").map(String).join("/"));
    },
    resolve(...parts) {
      const text = parts.filter((p) => p !== undefined && p !== null && p !== "").map(String).join("/");
      return cleanPath(text.startsWith("/") ? text : "/" + text);
    },
    dirname(input) {
      const text = cleanPath(input);
      const index = text.lastIndexOf("/");
      if (index < 0) return ".";
      return index === 0 ? "/" : text.slice(0, index);
    },
    basename(input) {
      const text = cleanPath(input);
      const index = text.lastIndexOf("/");
      return index < 0 ? text : text.slice(index + 1);
    },
    extname(input) {
      const base = pathShim.basename(input);
      const index = base.lastIndexOf(".");
      return index <= 0 ? "" : base.slice(index);
    },
  };
  function fileURLToPath(url) {
    let text = String(url).replace(/^file:\/\//i, "").replace(/^app:\/\//i, "");
    try { text = decodeURIComponent(text); } catch (error) { /* 保持原样 */ }
    return text.startsWith("/") ? text : "/" + text;
  }

  /* ------------------------------- zlib -------------------------------
     引擎只用到三处：解 PNG 的 IDAT、写 PNG 的 IDAT、打包 docx 的 zip。
     这里统一用 deflate 的「存储块」（不压缩），格式完全合法，只是文件稍大，
     换来的是不用在浏览器里塞一整套压缩算法。 */
  const CRC_TABLE = (() => {
    const table = new Uint32Array(256);
    for (let i = 0; i < 256; i++) {
      let value = i;
      for (let bit = 0; bit < 8; bit++) value = value & 1 ? 0xedb88320 ^ (value >>> 1) : value >>> 1;
      table[i] = value >>> 0;
    }
    return table;
  })();
  function crc32(bytes) {
    let value = 0xffffffff;
    for (let i = 0; i < bytes.length; i++) value = CRC_TABLE[(value ^ bytes[i]) & 0xff] ^ (value >>> 8);
    return (value ^ 0xffffffff) >>> 0;
  }
  function adler32(bytes) {
    let a = 1;
    let b = 0;
    for (let i = 0; i < bytes.length; i++) {
      a = (a + bytes[i]) % 65521;
      b = (b + a) % 65521;
    }
    return new Uint8Array([(b >>> 8) & 0xff, b & 0xff, (a >>> 8) & 0xff, a & 0xff]);
  }
  function storedBlocks(bytes) {
    const blocks = [];
    if (bytes.length === 0) {
      blocks.push(new Uint8Array([1, 0, 0, 255, 255]));
      return blocks;
    }
    for (let pos = 0; pos < bytes.length; pos += 65535) {
      const chunk = bytes.subarray(pos, Math.min(pos + 65535, bytes.length));
      const last = pos + chunk.length >= bytes.length;
      const head = new Uint8Array(5);
      head[0] = last ? 1 : 0; // BFINAL + BTYPE=00
      head[1] = chunk.length & 0xff;
      head[2] = (chunk.length >>> 8) & 0xff;
      head[3] = ~chunk.length & 0xff;
      head[4] = (~chunk.length >>> 8) & 0xff;
      blocks.push(head, chunk);
    }
    return blocks;
  }
  function joinBytes(blocks) {
    let total = 0;
    for (const block of blocks) total += block.length;
    const out = new Buf(total);
    let pos = 0;
    for (const block of blocks) {
      out.set(block, pos);
      pos += block.length;
    }
    return out;
  }
  const zlibShim = {
    deflateSync(bytes) {
      const payload = bytes.subarray(0);
      return joinBytes([new Uint8Array([0x78, 0x01]), ...storedBlocks(payload), adler32(payload)]);
    },
    deflateRawSync(bytes) {
      return joinBytes(storedBlocks(bytes.subarray(0)));
    },
    inflateSync(bytes) {
      const input = bytes.subarray(0);
      if (input.length < 2) throw new Error("deflate 数据太短");
      if ((input[0] & 0x0f) !== 8) throw new Error("不支持的 zlib 压缩方式");
      if (((input[0] << 8) | input[1]) % 31 !== 0) throw new Error("zlib 头校验失败");
      let pos = 2;
      const parts = [];
      for (;;) {
        if (pos >= input.length) throw new Error("deflate 数据不完整");
        const header = input[pos++];
        const last = (header & 1) === 1;
        const type = (header >> 1) & 3;
        if (type !== 0) throw new Error("遇到了压缩块（type=" + type + "）");
        if (pos + 4 > input.length) throw new Error("deflate 存储块头不完整");
        const length = input[pos] | (input[pos + 1] << 8);
        const nlength = input[pos + 2] | (input[pos + 3] << 8);
        pos += 4;
        if ((length ^ 0xffff) !== nlength) throw new Error("deflate 存储块长度校验失败");
        if (pos + length > input.length) throw new Error("deflate 存储块数据不完整");
        parts.push(input.subarray(pos, pos + length));
        pos += length;
        if (last) break;
      }
      return joinBytes(parts);
    },
  };

  // PNG 的编码统一用 app\auto_crop.mjs 里的 encodeRgbPng（这里传进去本站的 deflate）
  /* -------------------------------- fs -------------------------------- */
  function createMemoryFs() {
    const files = new Map();
    const dirs = new Set(["/"]);
    const norm = (input) => cleanPath(input);
    const dirOf = (file) => {
      const text = norm(file);
      const index = text.lastIndexOf("/");
      return index <= 0 ? "/" : text.slice(0, index);
    };
    const remember = (dir) => {
      let text = norm(dir);
      for (;;) {
        dirs.add(text);
        if (text === "/") break;
        text = dirOf(text);
      }
    };
    const asBuf = (data) => {
      if (data instanceof Buf) return data;
      return new Buf(data.buffer.slice(data.byteOffset, data.byteOffset + data.byteLength));
    };
    return {
      _files: files,
      readFileSync(file) {
        const key = norm(file);
        if (!files.has(key)) {
          const error = new Error("ENOENT: no such file or directory, open '" + key + "'");
          error.code = "ENOENT";
          throw error;
        }
        return asBuf(files.get(key));
      },
      writeFileSync(file, data) {
        const key = norm(file);
        files.set(key, new Uint8Array(data.buffer.slice(data.byteOffset, data.byteOffset + data.byteLength)));
        remember(dirOf(key));
      },
      mkdirSync(dir) { remember(dir); },
      copyFileSync(from, to) {
        const source = files.get(norm(from));
        if (!source) throw new Error("ENOENT: no such file or directory, copyfile '" + from + "'");
        files.set(norm(to), source);
        remember(dirOf(to));
      },
      existsSync(target) {
        const key = norm(target);
        return files.has(key) || dirs.has(key);
      },
      readdirSync(dir) {
        const key = norm(dir);
        const prefix = key === "/" ? "/" : key + "/";
        const names = new Set();
        for (const file of files.keys()) {
          if (!file.startsWith(prefix)) continue;
          names.add(file.slice(prefix.length).split("/")[0]);
        }
        return [...names];
      },
      statSync(target) {
        const key = norm(target);
        const data = files.get(key);
        return {
          size: data ? data.byteLength : 0,
          isFile: () => files.has(key),
          isDirectory: () => dirs.has(key),
        };
      },
      rmSync(target) {
        const key = norm(target);
        for (const file of [...files.keys()]) {
          if (key === "/" || file === key || file.startsWith(key + "/")) files.delete(file);
        }
      },
    };
  }

  /* ---------- 用浏览器自带的 deflate 把产物再压一遍（可选，缺了也能跑） ---------- */
  function supportsRawDeflate() {
    try {
      if (typeof CompressionStream !== "function" || typeof DecompressionStream !== "function") return false;
      new CompressionStream("deflate-raw");
      new DecompressionStream("deflate-raw");
      return true;
    } catch (error) {
      return false;
    }
  }
  async function streamBytes(stream) {
    return new Uint8Array(await new Response(stream).arrayBuffer());
  }
  function deflateRawBytes(data) {

    end.writeUInt16LE(0, 4);
    end.writeUInt16LE(0, 6);

<script>
/* 自动裁切到印章：与桌面版共用 app\auto_crop.mjs，逻辑一字未改 */
globalThis.SealAutoCrop = (function () {
/**
 * 自动裁切到印章 —— 可选的前处理，不属于黑白化/排版算法。
 *
 * 为什么需要它：引擎自己已经会"裁掉白边"（按彩度找出印迹范围再裁），所以白纸上的
 * 印章本来就裁得挺准。真正会出问题的是**大照片**：桌面木纹、彩色背景、红色印刷字
 * 这些也带彩度，会被算进"印迹"，结果裁出来的范围跑偏。
 *
 * 这里的做法分两步，永远往"多留一点"的方向偏，保证不切到印章：
 *   1) 锚定：用"印泥偏红"（R 明显高于 G、B）挑出最像印章的一块（考虑面积 + 方正程度），
 *      周围 60% 范围内的碎块一起并进来（印章里断开的笔画就属于这种）。
 *      如果整张图几乎没有偏红的东西（蓝章、黑章），就退回引擎自己的彩度掩膜。
 *   2) 补边：在锚定框放大 30% 的范围内，把引擎彩度掩膜里的印迹也算进来（怕印章边缘淡），
 *      然后在外圈再加 10% 边距（最少 12 像素）。裁切框只放大、不缩小，所以不会切到印章。
 *   找不到任何印迹、或者本来就已经几乎是整张图时，原样返回，绝不乱裁。
 *
 * 这个文件被两处共用，改一处即可：
 *   · 桌面版：app\server.mjs 直接 import
 *   · 手机版：手机版\生成手机版.mjs 内联进 手机版.html
 */

const DEFAULTS = {
  detectEdge: 900, // 检测时把最长边缩到这个尺寸（只看大致位置，够用且快）
  redMin: 55, // 印泥偏红：R - max(G,B) 至少这么大
  redMinChannel: 90, // 且 R 本身要够亮，避免抓到暗红阴影
  redAreaRatio: 0.0002, // 偏红像素太少了就认为不是红章
  minAreaRatio: 0.0004, // 连通域最小面积（占整图比例），滤掉噪点
  reachRatio: 0.6, // 锚定块周围多大范围内的碎块算同一个印章
  looseRedRatio: 0.45, // 补边用的"淡印子"阈值 = redMin * 这个比例
  looseChannelDrop: 25, // 补边时 R 通道下限再降低这么多
  maxGrowRatio: 0.5, // 补边后面积超过整图这个比例就认为并进背景了，放弃补边
  marginRatio: 0.1, // 最终边距（占裁切框比例）
  marginMinPx: 12, // 最终边距最小值（原图像素）
  skipAreaRatio: 0.92 // 裁切框已经接近整张图就不裁了
};

/* ------------------------------- 通用工具 ------------------------------- */

const CRC_TABLE = (() => {
  const table = new Uint32Array(256);
  for (let i = 0; i < 256; i++) {
    let value = i;
    for (let bit = 0; bit < 8; bit++) value = value & 1 ? 0xedb88320 ^ (value >>> 1) : value >>> 1;
    table[i] = value >>> 0;
  }
  return table;
})();

function crc32(bytes) {
  let value = 0xffffffff;
  for (let i = 0; i < bytes.length; i++) value = CRC_TABLE[(value ^ bytes[i]) & 0xff] ^ (value >>> 8);
  return (value ^ 0xffffffff) >>> 0;
}

/**
 * 把 RGB 像素写成 PNG 字节。
 * deflate：把原始字节压成 zlib 流的函数
 *   · Node 里传 (data) => zlib.deflateSync(data, { level: 6 })
 *   · 浏览器里传兼容层里的 deflateSync
 */
function encodeRgbPng(rgb, width, height, deflate) {
  const rowBytes = width * 3;
  const raw = new Uint8Array((rowBytes + 1) * height);
  for (let y = 0; y < height; y++) {
    raw[y * (rowBytes + 1)] = 0; // 过滤器 0：不滤波
    raw.set(rgb.subarray(y * rowBytes, (y + 1) * rowBytes), y * (rowBytes + 1) + 1);

    const out = new Uint8Array(12 + data.length);
    const view = new DataView(out.buffer);
    view.setUint32(0, data.length);
    for (let i = 0; i < 4; i++) out[4 + i] = type.charCodeAt(i);
    out.set(data, 8);
    const crcBytes = new Uint8Array(out.buffer, 4, 4 + data.length);
    view.setUint32(8 + data.length, crc32(crcBytes));
    return out;
  };
  const ihdr = new Uint8Array(13);
  const ihdrView = new DataView(ihdr.buffer);
  ihdrView.setUint32(0, width);
  ihdrView.setUint32(4, height);
  ihdr[8] = 8; // 每通道 8 位
  ihdr[9] = 2; // 真彩色 RGB
  const signature = new Uint8Array([0x89, 0x50, 0x4e, 0x47, 0x0d, 0x0a, 0x1a, 0x0a]);

  for (const part of parts) total += part.length;
  const out = new Uint8Array(total);
  let pos = 0;
  for (const part of parts) {
    out.set(part, pos);
    pos += part.length;
  }
  return out;

/* ---------------------------- 检测：缩图 + 掩膜 ---------------------------- */

function downscaleToRgba(rgb, width, height, dw, dh) {
  const rgba = new Uint8Array(dw * dh * 4);
  for (let y = 0; y < dh; y++) {
    const sy = Math.min(height - 1, Math.floor(((y + 0.5) * height) / dh));
    for (let x = 0; x < dw; x++) {
      const sx = Math.min(width - 1, Math.floor(((x + 0.5) * width) / dw));
      const s = (sy * width + sx) * 3;
      const d = (y * dw + x) * 4;
      rgba[d] = rgb[s];
      rgba[d + 1] = rgb[s + 1];
      rgba[d + 2] = rgb[s + 2];
      rgba[d + 3] = 255;
    }
  }
  return rgba;
}

/** 印泥偏红掩膜：R 明显高于 G/B 且不太暗 */
function redMask(rgba, total, options) {
  const mask = new Uint8Array(total);
  let count = 0;
  for (let i = 0; i < total; i++) {
    const r = rgba[i * 4];
    if (r < options.redMinChannel) continue;
    const g = rgba[i * 4 + 1];
    const b = rgba[i * 4 + 2];
    const mx = g > b ? g : b;
    if (r - mx >= options.redMin) {
      mask[i] = 1;
      count++;
    }
  }
  return { mask, count };

/** 连通域（4 邻域，迭代式，不递归） */
function components(mask, width, height, minArea) {
  const seen = new Uint8Array(width * height);
  const stack = new Int32Array(width * height);
  const out = [];
  for (let start = 0; start < mask.length; start++) {
    if (!mask[start] || seen[start]) continue;
    const seed = start;
    let top = 0;
    stack[top++] = start;
    seen[start] = 1;
    let area = 0;
    let minX = width;
    let maxX = -1;
    let minY = height;
    let maxY = -1;
    while (top > 0) {
      const p = stack[--top];
      const x = p % width;
      const y = (p - x) / width;
      area++;
      if (x < minX) minX = x;
      if (x > maxX) maxX = x;
      if (y < minY) minY = y;
      if (y > maxY) maxY = y;
      if (x > 0 && mask[p - 1] && !seen[p - 1]) { seen[p - 1] = 1; stack[top++] = p - 1; }
      if (x < width - 1 && mask[p + 1] && !seen[p + 1]) { seen[p + 1] = 1; stack[top++] = p + 1; }
      if (y > 0 && mask[p - width] && !seen[p - width]) { seen[p - width] = 1; stack[top++] = p - width; }
      if (y < height - 1 && mask[p + width] && !seen[p + width]) { seen[p + width] = 1; stack[top++] = p + width; }
    }
    if (area >= minArea) out.push({ area, seed, x: minX, y: minY, w: maxX - minX + 1, h: maxY - minY + 1 });
  }
  return out;
}

function unionNear(boxes, opts) {
  if (!boxes.length) return null;
  // 面积大、形状方正（长宽接近）的更像印章
  const scored = boxes
    .map((box) => ({
      ...box,
      score: box.area * Math.sqrt(Math.min(box.w, box.h) / Math.max(box.w, box.h))
    }))
    .sort((a, b) => b.score - a.score);
  const winner = scored[0];
  const reach = Math.max(winner.w, winner.h) * opts.reachRatio;
  let minX = winner.x;
  let minY = winner.y;
  let maxX = winner.x + winner.w;
  let maxY = winner.y + winner.h;
  for (const box of scored) {
    const cx = box.x + box.w / 2;
    const cy = box.y + box.h / 2;
    const near =
      cx >= winner.x - reach && cx <= winner.x + winner.w + reach &&
      cy >= winner.y - reach && cy <= winner.y + winner.h + reach;
    if (!near) continue;
    minX = Math.min(minX, box.x);
    minY = Math.min(minY, box.y);
    maxX = Math.max(maxX, box.x + box.w);
    maxY = Math.max(maxY, box.y + box.h);
  }

/** 宽松的"淡印子"掩膜：印章边缘偏淡时也能算进来 */
function looseRedMask(rgba, total, options) {
  const mask = new Uint8Array(total);
  const minRed = Math.max(16, Math.round(options.redMin * options.looseRedRatio));
  const minChannel = Math.max(60, options.redMinChannel - options.looseChannelDrop);
  for (let i = 0; i < total; i++) {
    const r = rgba[i * 4];
    if (r < minChannel) continue;
    const g = rgba[i * 4 + 1];
    const b = rgba[i * 4 + 2];
    const mx = g > b ? g : b;
    if (r - mx >= minRed) mask[i] = 1;
  }
  return mask;
}

/**
 * 从种子点沿着"淡印子"连出去，得到整块印章的范围。
 * 关键：靠连通性往外走 —— 印章自己的淡边会被带上，
 * 而旁边颜色相近的桌子/logo 因为不连通，不会被并进来。
 */
function growComponent(mask, width, height, seed) {
  if (!mask[seed]) return null;
  const seen = new Uint8Array(width * height);
  const stack = new Int32Array(width * height);
  let top = 0;
  stack[top++] = seed;
  seen[seed] = 1;
  let area = 0;
  let minX = width;
  let maxX = -1;
  let minY = height;
  let maxY = -1;
  while (top > 0) {
    const p = stack[--top];
    const x = p % width;
    const y = (p - x) / width;
    area++;
    if (x < minX) minX = x;
    if (x > maxX) maxX = x;
    if (y < minY) minY = y;
    if (y > maxY) maxY = y;
    if (x > 0 && mask[p - 1] && !seen[p - 1]) { seen[p - 1] = 1; stack[top++] = p - 1; }
    if (x < width - 1 && mask[p + 1] && !seen[p + 1]) { seen[p + 1] = 1; stack[top++] = p + 1; }
    if (y > 0 && mask[p - width] && !seen[p - width]) { seen[p - width] = 1; stack[top++] = p - width; }
    if (y < height - 1 && mask[p + width] && !seen[p + width]) { seen[p + width] = 1; stack[top++] = p + width; }
  }
  return { area, x: minX, y: minY, w: maxX - minX + 1, h: maxY - minY + 1 };
}

/* ------------------------------- 主入口 ------------------------------- */

/**
 * @param engine 引擎对象（需要 inkMask / despeckle / inkBounds）
 * @param rgb    Uint8Array(width*height*3)
 * @returns { rgb, width, height, cropped, box, source, method }
 */
function autoCropRgb(engine, rgb, width, height, options = {}) {
  const opts = { ...DEFAULTS, ...options };
  const untouched = { rgb, width, height, cropped: false, box: null, source: { width, height }, method: "none" };
  if (!engine || typeof engine.inkMask !== "function" || typeof engine.despeckle !== "function") return untouched;
  if (!width || !height || !rgb || rgb.length < width * height * 3) return untouched;
  if (Math.max(width, height) < 64) return untouched;

  const scale = Math.min(1, opts.detectEdge / Math.max(width, height));
  const dw = Math.max(1, Math.round(width * scale));
  const dh = Math.max(1, Math.round(height * scale));
  const total = dw * dh;
  const rgba = downscaleToRgba(rgb, width, height, dw, dh);

  // 彩度掩膜（引擎自己的那套：饱和度 + Otsu，然后去杂点）
  const chromaResult = engine.inkMask({ width: dw, height: dh, data: rgba }, {});
  const chromaMask = chromaResult.mask;
  const speckle = Math.max(2, Math.round((opts.marginMinPx * dw) / Math.max(width, 1) / 2));
  engine.despeckle(chromaMask, dw, dh, speckle);

  // 偏红掩膜：锚定用
  const red = redMask(rgba, total, opts);
  const useRed = red.count >= Math.max(24, total * opts.redAreaRatio);
  const anchorMask = useRed ? red.mask : chromaMask;
  const method = useRed ? "red" : "chroma";

  const minArea = Math.max(16, Math.round(total * opts.minAreaRatio));
  const boxes = components(anchorMask, dw, dh, minArea);
  let box = unionNear(boxes, opts);
  if (!box) return { ...untouched, method: "none" };

  // 沿着"淡印子"的连通性把印章边缘补全（不会并进不连通的桌子/logo）
  if (useRed && box.seed !== undefined) {
    const grown = growComponent(looseRedMask(rgba, total, opts), dw, dh, box.seed);
    if (grown && grown.area <= total * opts.maxGrowRatio && grown.w < dw * 0.9 && grown.h < dh * 0.9) {
      const x = Math.min(box.x, grown.x);
      const y = Math.min(box.y, grown.y);
      box = {
        x,
        y,
        w: Math.max(box.x + box.w, grown.x + grown.w) - x,
        h: Math.max(box.y + box.h, grown.y + grown.h) - y,
      };
    }
  }

  // 换算回原图，留边距
  const sx = width / dw;
  const sy = height / dh;
  let x0 = Math.floor(box.x * sx) - 2;
  let y0 = Math.floor(box.y * sy) - 2;
  let x1 = Math.ceil((box.x + box.w) * sx) + 2;
  let y1 = Math.ceil((box.y + box.h) * sy) + 2;
  const padX = Math.max(opts.marginMinPx, Math.round((x1 - x0) * opts.marginRatio));
  const padY = Math.max(opts.marginMinPx, Math.round((y1 - y0) * opts.marginRatio));
  x0 = Math.max(0, x0 - padX);
  y0 = Math.max(0, y0 - padY);
  x1 = Math.min(width, x1 + padX);
  y1 = Math.min(height, y1 + padY);
  const cropW = x1 - x0;
  const cropH = y1 - y0;

  if (cropW < 16 || cropH < 16) return { ...untouched, method };
  if (cropW * cropH >= width * height * opts.skipAreaRatio) return { ...untouched, method }; // 本来就没多少多余背景

  // 只把"印章框"里的像素搬过来，框外（我们留出来的那圈边距）刷成白纸。
  // 这样边距既能保护印章不被切，又不会把旁边的桌面/红字/logo 混进成图。
  const innerX0 = Math.max(0, Math.floor(box.x * sx) - 2);
  const innerY0 = Math.max(0, Math.floor(box.y * sy) - 2);
  const innerX1 = Math.min(width, Math.ceil((box.x + box.w) * sx) + 2);
  const innerY1 = Math.min(height, Math.ceil((box.y + box.h) * sy) + 2);
  const out = new Uint8Array(cropW * cropH * 3).fill(255);
  for (let y = innerY0; y < innerY1; y++) {

    const to = ((y - y0) * cropW + (innerX0 - x0)) * 3;
    out.set(rgb.subarray(from, from + (innerX1 - innerX0) * 3), to);
  }
  return {
    rgb: out,
    width: cropW,
    height: cropH,
    cropped: true,
    box: { x: x0, y: y0, w: cropW, h: cropH },
    source: { width, height },
    method
  };

// The skill keeps its own state beside the script, so a catalogue recorded once
// keeps receiving new seals in later sessions instead of only the session that
// created it. `run()` reads this when no explicit `catalog` is passed.
const STATE_FILE = path.join(path.dirname(fileURLToPath("app://seal-layout/seal_layout.mjs")), "..", "state.json");

function readState() {
  try {
    return JSON.parse(fs.readFileSync(STATE_FILE, "utf8"));
  } catch {
    return {};
  }
}

function writeState(state) {
  // Remembering the catalogue is a convenience, never a precondition: some
  // sandboxes allow reading the skill folder but not writing it.
  try {
    fs.writeFileSync(STATE_FILE, JSON.stringify(state, null, 2) + "\n");
  } catch {
    /* keep going without persisting */
  }
}

/* ------------------------------------------------------------------ *
 * CRC32 + minimal ZIP writer (for the .docx container)
 * ------------------------------------------------------------------ */

const CRC_TABLE = (() => {
  const table = new Int32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
    table[n] = c;
  }
  return table;
})();

// Two compression passes touch the same bytes: the PNG payload, then the .docx
// container that stores it. Deflating the payload is the expensive pass, so do
// that cheaply and let the container pass be thorough — the container recovers
// most of the difference anyway. Measured on a 709x701 stamp: level 3 costs
// 8 ms for 15 KB, level 6 costs 16 ms for 13 KB, level 9 costs 80 ms for 6 KB.
// Callers can raise `pngCompression` when the smallest possible files matter.
const PNG_DEFLATE_LEVEL = 3;
const ZIP_DEFLATE_LEVEL = 9;

function crc32(buf) {
  let c = -1;
  for (let i = 0; i < buf.length; i++) c = CRC_TABLE[(c ^ buf[i]) & 0xff] ^ (c >>> 8);
  return (c ^ -1) >>> 0;
}

/** entries: [{ name, data: Buffer, store? }] -> ZIP archive Buffer */
function zipArchive(entries) {
  const local = [];
  const central = [];
  let offset = 0;

  for (const entry of entries) {
    const nameBuf = Buffer.from(entry.name, "utf8");
    const raw = entry.data;
    const method = entry.store ? 0 : 8;
    const body = method === 0 ? raw : zlib.deflateRawSync(raw, { level: ZIP_DEFLATE_LEVEL });
    const crc = crc32(raw);

    const lh = Buffer.alloc(30);
    lh.writeUInt32LE(0x04034b50, 0);
    lh.writeUInt16LE(20, 4);
    lh.writeUInt16LE(0x0800, 6);
    lh.writeUInt16LE(method, 8);
    lh.writeUInt16LE(0, 10);
    lh.writeUInt16LE(0x21, 12);
    lh.writeUInt32LE(crc, 14);
    lh.writeUInt32LE(body.length, 18);
    lh.writeUInt32LE(raw.length, 22);
    lh.writeUInt16LE(nameBuf.length, 26);
    lh.writeUInt16LE(0, 28);
    local.push(lh, nameBuf, body);

    const ch = Buffer.alloc(46);
    ch.writeUInt32LE(0x02014b50, 0);
    ch.writeUInt16LE(20, 4);
    ch.writeUInt16LE(20, 6);
    ch.writeUInt16LE(0x0800, 8);
    ch.writeUInt16LE(method, 10);
    ch.writeUInt16LE(0, 12);
    ch.writeUInt16LE(0x21, 14);
    ch.writeUInt32LE(crc, 16);
    ch.writeUInt32LE(body.length, 20);
    ch.writeUInt32LE(raw.length, 24);
    ch.writeUInt16LE(nameBuf.length, 28);
    ch.writeUInt16LE(0, 30);
    ch.writeUInt16LE(0, 32);
    ch.writeUInt16LE(0, 34);
    ch.writeUInt16LE(0, 36);
    ch.writeUInt32LE(0, 38);
    ch.writeUInt32LE(offset, 42);
    central.push(ch, nameBuf);

    offset += lh.length + nameBuf.length + body.length;
  }

  const centralBuf = Buffer.concat(central);
  const end = Buffer.alloc(22);
  end.writeUInt32LE(0x06054b50, 0);
  end.writeUInt16LE(0, 4);
  end.writeUInt16LE(0, 6);
  end.writeUInt16LE(entries.length, 8);
  end.writeUInt16LE(entries.length, 10);
  end.writeUInt32LE(centralBuf.length, 12);
  end.writeUInt32LE(offset, 16);
  end.writeUInt16LE(0, 20);

  return Buffer.concat([...local, centralBuf, end]);
}

/* ------------------------------------------------------------------ *
 * PNG decode (8/16-bit gray, palette, RGB, RGBA; non-interlaced)
 * ------------------------------------------------------------------ */

const CHANNELS = { 0: 1, 2: 3, 3: 1, 4: 2, 6: 4 };

function decodePNG(buf) {
  if (buf.length < 8 || buf.readUInt32BE(0) !== 0x89504e47) throw new Error("not a PNG file");
  let off = 8;
  let ihdr = null;
  let palette = null;
  const idat = [];
  while (off + 8 <= buf.length) {
    const len = buf.readUInt32BE(off);
    const type = buf.toString("ascii", off + 4, off + 8);
    const data = buf.subarray(off + 8, off + 8 + len);
    if (type === "IHDR") {
      ihdr = {
        width: data.readUInt32BE(0),
        height: data.readUInt32BE(4),
        bitDepth: data[8],
        colorType: data[9],
        interlace: data[12],
      };
    } else if (type === "PLTE") palette = Buffer.from(data);
    else if (type === "IDAT") idat.push(Buffer.from(data));
    else if (type === "IEND") break;
    off += 12 + len;
  }
  if (!ihdr) throw new Error("PNG is missing IHDR");
  if (ihdr.interlace !== 0) throw new Error("interlaced PNG is not supported");
  const channels = CHANNELS[ihdr.colorType];
  if (!channels) throw new Error("unsupported PNG color type " + ihdr.colorType);
  if (!idat.length) throw new Error("PNG has no image data");

  const { width, height, bitDepth, colorType } = ihdr;
  const bitsPerPixel = channels * bitDepth;
  const rowBytes = Math.ceil((width * bitsPerPixel) / 8);
  const bpp = Math.max(1, Math.ceil(bitsPerPixel / 8));
  const raw = zlib.inflateSync(Buffer.concat(idat));

  const pixels = Buffer.alloc(rowBytes * height);
  let prev = Buffer.alloc(rowBytes);
  let pos = 0;
  for (let y = 0; y < height; y++) {
    const filter = raw[pos++];
    const line = Buffer.from(raw.subarray(pos, pos + rowBytes));
    pos += rowBytes;
    for (let i = 0; i < rowBytes; i++) {
      const a = i >= bpp ? line[i - bpp] : 0;
      const b = prev[i];
      const c = i >= bpp ? prev[i - bpp] : 0;
      switch (filter) {
        case 0: break;
        case 1: line[i] = (line[i] + a) & 0xff; break;
        case 2: line[i] = (line[i] + b) & 0xff; break;
        case 3: line[i] = (line[i] + ((a + b) >> 1)) & 0xff; break;
        case 4: {
          const p = a + b - c;
          const pa = Math.abs(p - a);
          const pb = Math.abs(p - b);
          const pc = Math.abs(p - c);
          const pred = pa <= pb && pa <= pc ? a : pb <= pc ? b : c;
          line[i] = (line[i] + pred) & 0xff;
          break;
        }
        default: throw new Error("unknown PNG filter type " + filter);
      }
    }
    line.copy(pixels, y * rowBytes);
    prev = line;
  }

  const readBits = (row, bitOffset) => {
    if (bitDepth === 8) return pixels[row * rowBytes + bitOffset / 8];
    const byteIndex = row * rowBytes + (bitOffset >> 3);
    const bitStart = bitOffset & 7;
    const avail = 8 - bitStart;
    if (avail >= bitDepth) {
      return (pixels[byteIndex] >> (avail - bitDepth)) & ((1 << bitDepth) - 1);
    }
    const hi = pixels[byteIndex] & ((1 << avail) - 1);
    const lo = pixels[byteIndex + 1] >> (8 - (bitDepth - avail));
    return (hi << (bitDepth - avail)) | lo;
  };
  const scale = bitDepth < 8 ? 255 / ((1 << bitDepth) - 1) : 1;

  /**
   * Read sample `index` of a row without scaling (palette lookups) ...
   * ... or scaled to 0-255 (grey / colour channels).
   */
  const rawSample = (row, index) => {
    if (bitDepth === 16) return pixels[row * rowBytes + index * 2];
    if (bitDepth === 8) return pixels[row * rowBytes + index];
    return readBits(row, index * bitDepth);
  };
  const sample = (row, index) => {
    const value = rawSample(row, index);
    return bitDepth === 16 ? value : bitDepth < 8 ? Math.round(value * scale) : value;
  };

  // Fast paths for the layouts that need no per-pixel work: 8-bit RGBA is
  // already in the byte order this module uses, and the other 8-bit layouts
  // only need a channel shuffle. Seal scans are almost always 8-bit RGBA.
  const total = width * height;
  if (bitDepth === 8 && colorType === 6) return { width, height, data: pixels };
  if (bitDepth === 8 && (colorType === 0 || colorType === 2 || colorType === 4)) {
    const rgba = Buffer.alloc(total * 4, 255);
    const step = colorType === 2 ? 3 : colorType === 4 ? 2 : 1;
    for (let i = 0, j = 0; i < total; i++, j += step) {
      const o = i * 4;
      if (step === 1) {
        rgba[o] = rgba[o + 1] = rgba[o + 2] = pixels[j];
      } else if (step === 2) {
        rgba[o] = rgba[o + 1] = rgba[o + 2] = pixels[j];
        rgba[o + 3] = pixels[j + 1];
      } else {
        rgba[o] = pixels[j];
        rgba[o + 1] = pixels[j + 1];
        rgba[o + 2] = pixels[j + 2];
      }
    }
    return { width, height, data: rgba };
  }

  const rgba = Buffer.alloc(total * 4, 255);
  for (let y = 0; y < height; y++) {
    for (let x = 0; x < width; x++) {
      const o = (y * width + x) * 4;
      if (colorType === 3) {
        const idx = rawSample(y, x);
        rgba[o] = palette[idx * 3];
        rgba[o + 1] = palette[idx * 3 + 1];
        rgba[o + 2] = palette[idx * 3 + 2];
      } else {
        const base = x * channels;
        if (colorType === 0 || colorType === 4) {
          const g = sample(y, base);
          rgba[o] = g;
          rgba[o + 1] = g;
          rgba[o + 2] = g;
          if (colorType === 4) rgba[o + 3] = sample(y, base + 1);
        } else {
          rgba[o] = sample(y, base);
          rgba[o + 1] = sample(y, base + 1);
          rgba[o + 2] = sample(y, base + 2);
          if (colorType === 6) rgba[o + 3] = sample(y, base + 3);
        }
      }
    }
  }
  return { width, height, data: rgba };
}

/* ------------------------------------------------------------------ *
 * PNG encode (8-bit grayscale)
 * ------------------------------------------------------------------ */

function pngChunk(type, data) {
  const len = Buffer.alloc(4);
  len.writeUInt32BE(data.length, 0);
  const typeBuf = Buffer.from(type, "ascii");
  const crc = Buffer.alloc(4);
  crc.writeUInt32BE(crc32(Buffer.concat([typeBuf, data])), 0);
  return Buffer.concat([len, typeBuf, data, crc]);
}

/** gray: Uint8Array of width*height samples (0 = black, 255 = white). */
function encodeGrayPNG(width, height, gray, compressionLevel = PNG_DEFLATE_LEVEL) {
  const raw = Buffer.alloc(height * (width + 1));
  for (let y = 0; y < height; y++) {
    raw[y * (width + 1)] = 0;
    Buffer.from(gray.buffer, gray.byteOffset + y * width, width).copy(raw, y * (width + 1) + 1);
  }
  const ihdr = Buffer.alloc(13);
  ihdr.writeUInt32BE(width, 0);
  ihdr.writeUInt32BE(height, 4);
  ihdr[8] = 8;
  ihdr[9] = 0;
  return Buffer.concat([
    Buffer.from([0x89, 0x50, 0x4e, 0x47, 0x0d, 0x0a, 0x1a, 0x0a]),
    pngChunk("IHDR", ihdr),
    pngChunk("IDAT", zlib.deflateSync(raw, { level: compressionLevel })),
    pngChunk("IEND", Buffer.alloc(0)),
  ]);
}

/* ------------------------------------------------------------------ *
 * Ink detection
 * ------------------------------------------------------------------ */

function otsu(histogram, total) {
  let sumAll = 0;
  for (let t = 0; t < 256; t++) sumAll += t * histogram[t];
  let accSum = 0;
  let accWeight = 0;
  let best = -1;
  let threshold = 0;
  for (let t = 0; t < 256; t++) {
    accWeight += histogram[t];
    if (accWeight === 0) continue;
    const restWeight = total - accWeight;
    if (restWeight === 0) break;
    accSum += t * histogram[t];
    const meanLow = accSum / accWeight;
    const meanHigh = (sumAll - accSum) / restWeight;
    const spread = accWeight * restWeight * (meanLow - meanHigh) ** 2;
    if (spread > best) {
      best = spread;
      threshold = t;
    }
  }
  return threshold;
}

/**
 * Decide which pixels are ink (seal paste) and return a binary mask where 1
 * means ink. Seal paste is strongly saturated, so chroma (max-min channel)
 * separates it cleanly from white paper. Images carrying no saturated ink
 * (already-black scans) fall back to luminance.
 */
function inkMask(png, options) {
  const { width, height, data } = png;
  const total = width * height;
  const chroma = new Uint8Array(total);
  const luma = new Uint8Array(total);
  const chromaHist = new Int32Array(256);
  const lumaHist = new Int32Array(256);
  let maxChroma = 0;

  for (let i = 0; i < total; i++) {
    const r = data[i * 4];
    const g = data[i * 4 + 1];
    const b = data[i * 4 + 2];
    const alpha = data[i * 4 + 3];
    // Ternaries and integer luma instead of Math.* keep this per-pixel loop
    // cheap; see the note in resampleMask.
    const mx = r > g ? (r > b ? r : b) : g > b ? g : b;
    const mn = r < g ? (r < b ? r : b) : g < b ? g : b;
    const c = alpha < 128 ? 0 : mx - mn;
    const l = ((r * 299 + g * 587 + b * 114) / 1000) | 0;
    chroma[i] = c;
    luma[i] = l;
    chromaHist[c]++;
    lumaHist[l]++;
    if (c > maxChroma) maxChroma = c;
  }

  const useLuma = maxChroma < 40;
  const histogram = useLuma ? lumaHist : chromaHist;
  const auto = otsu(histogram, total);
  const threshold = options.threshold ?? auto;

  const mask = new Uint8Array(total);
  if (useLuma) {
    for (let i = 0; i < total; i++) mask[i] = luma[i] <= threshold ? 1 : 0;
  } else {
    for (let i = 0; i < total; i++) mask[i] = chroma[i] > threshold ? 1 : 0;
  }
  return { mask, threshold, autoThreshold: auto, usedLuma: useLuma, maxChroma };
}

/** Drop ink blobs smaller than minArea pixels. Returns removed pixel count. */
function despeckle(mask, width, height, minArea) {
  if (!minArea || minArea <= 1) return 0;
  const seen = new Uint8Array(mask.length);
  const stack = new Int32Array(mask.length);
  const blob = new Int32Array(mask.length);
  let removed = 0;
  for (let start = 0; start < mask.length; start++) {
    if (!mask[start] || seen[start]) continue;
    let top = 0;
    let count = 0;
    stack[top++] = start;
    seen[start] = 1;
    while (top > 0) {
      const p = stack[--top];
      blob[count++] = p;
      const x = p % width;
      const y = (p - x) / width;
      if (x > 0) { const q = p - 1; if (mask[q] && !seen[q]) { seen[q] = 1; stack[top++] = q; } }
      if (x < width - 1) { const q = p + 1; if (mask[q] && !seen[q]) { seen[q] = 1; stack[top++] = q; } }
      if (y > 0) { const q = p - width; if (mask[q] && !seen[q]) { seen[q] = 1; stack[top++] = q; } }
      if (y < height - 1) { const q = p + width; if (mask[q] && !seen[q]) { seen[q] = 1; stack[top++] = q; } }
    }
    if (count < minArea) {
      for (let i = 0; i < count; i++) mask[blob[i]] = 0;
      removed += count;
    }
  }
  return removed;
}

/** Smallest box containing ink, or null when the image has no ink. */
function inkBounds(mask, width, height) {
  let minX = width;
  let minY = height;
  let maxX = -1;
  let maxY = -1;
  for (let y = 0; y < height; y++) {
    const row = y * width;
    for (let x = 0; x < width; x++) {
      if (!mask[row + x]) continue;
      if (x < minX) minX = x;
      if (x > maxX) maxX = x;
      if (y < minY) minY = y;
      if (y > maxY) maxY = y;
    }
  }
  if (maxX < 0) return null;
  return { x: minX, y: minY, width: maxX - minX + 1, height: maxY - minY + 1 };
}

// Scratch space for resampleMask, reused across calls. One 600 dpi stamp wants
// a few megabytes, and allocating that for every stamp costs real time.
let resampleScratch = null;

/**
 * Resample a binary mask. Downscaling averages ink coverage so thin strokes
 * survive; upscaling interpolates and re-thresholds so enlarged edges stay
 * smooth instead of turning into blocks.
 */
function resampleMask(mask, sw, sh, tw, th, coverageThreshold) {
  const out = new Uint8Array(tw * th);
  const sx = sw / tw;
  const sy = sh / th;
  const clamp = (value, hi) => (value < 0 ? 0 : value > hi ? hi : value);

  // Every plan below is built once per output column/row. Keeping Math.* out of
  // the pixel loops is what makes this fast: on this JS host a per-pixel Math
  // call costs about 85x more than the surrounding arithmetic.
  if (tw < sw || th < sh) {
    // Fractional area averaging, so thin strokes survive a downscale.
    const xSpans = [];
    for (let tx = 0; tx < tw; tx++) {
      const x0 = tx * sx;
      const x1 = x0 + sx;
      const span = [];
      for (let ix = Math.floor(x0); ix < Math.ceil(x1); ix++) {
        const lo = ix > x0 ? ix : x0;
        const hi = ix + 1 < x1 ? ix + 1 : x1;
        if (hi > lo) span.push(clamp(ix, sw - 1), hi - lo);
      }
      xSpans.push(span);
    }
    const ySpans = [];
    for (let ty = 0; ty < th; ty++) {
      const y0 = ty * sy;
      const y1 = y0 + sy;
      const span = [];
      for (let iy = Math.floor(y0); iy < Math.ceil(y1); iy++) {
        const lo = iy > y0 ? iy : y0;
        const hi = iy + 1 < y1 ? iy + 1 : y1;
        if (hi > lo) span.push(clamp(iy, sh - 1), hi - lo);
      }
      ySpans.push(span);
    }
    // Horizontal pass, then vertical: total work is O(sh*tw + th*tw).
    const needed = sh * tw;
    if (resampleScratch === null || resampleScratch.length < needed) {
      resampleScratch = new Float64Array(needed);
    }
    const rows = resampleScratch.subarray(0, needed);
    for (let y = 0; y < sh; y++) {
      const srcBase = y * sw;
      const dstBase = y * tw;
      for (let tx = 0; tx < tw; tx++) {
        const span = xSpans[tx];
        let acc = 0;
        for (let k = 0; k < span.length; k += 2) {
          if (mask[srcBase + span[k]]) acc += span[k + 1];
        }
        rows[dstBase + tx] = acc / sx;
      }
    }
    for (let ty = 0; ty < th; ty++) {
      const span = ySpans[ty];
      const dstBase = ty * tw;
      for (let tx = 0; tx < tw; tx++) {
        let acc = 0;
        for (let k = 0; k < span.length; k += 2) {
          acc += rows[span[k] * tw + tx] * span[k + 1];
        }
        out[dstBase + tx] = acc / sy >= coverageThreshold ? 1 : 0;
      }
    }
    return out;
  }

  // Bilinear upscale, so enlarged edges stay smooth instead of turning blocky.
  const X0 = new Int32Array(tw);
  const X1 = new Int32Array(tw);
  const WX = new Float64Array(tw);
  for (let tx = 0; tx < tw; tx++) {
    const fx = (tx + 0.5) * sx - 0.5;
    const x0 = clamp(Math.floor(fx), sw - 1);
    X0[tx] = x0;
    X1[tx] = clamp(x0 + 1, sw - 1);
    WX[tx] = clamp(fx - x0, 1);
  }
  const Y0 = new Int32Array(th);
  const Y1 = new Int32Array(th);
  const WY = new Float64Array(th);
  for (let ty = 0; ty < th; ty++) {
    const fy = (ty + 0.5) * sy - 0.5;
    const y0 = clamp(Math.floor(fy), sh - 1);
    Y0[ty] = y0;
    Y1[ty] = clamp(y0 + 1, sh - 1);
    WY[ty] = clamp(fy - y0, 1);
  }
  for (let ty = 0; ty < th; ty++) {
    const r0 = Y0[ty] * sw;
    const r1 = Y1[ty] * sw;
    const wy = WY[ty];
    const iwy = 1 - wy;
    const dstBase = ty * tw;
    for (let tx = 0; tx < tw; tx++) {
      const x0 = X0[tx];
      const x1 = X1[tx];
      const wx = WX[tx];
      const iwx = 1 - wx;
      const v =
        mask[r0 + x0] * iwx * iwy +
        mask[r0 + x1] * wx * iwy +
        mask[r1 + x0] * iwx * wy +
        mask[r1 + x1] * wx * wy;
      out[dstBase + tx] = v >= 0.5 ? 1 : 0;
    }
  }
  return out;
}

/** Render a mask into an 8-bit grayscale PNG (ink = pure black, paper = white). */
function renderStamp(mask, width, height, options) {
  const padPx = options.padPx | 0;
  const outW = width + padPx * 2;
  const outH = height + padPx * 2;
  const gray = new Uint8Array(outW * outH).fill(255);
  for (let y = 0; y < height; y++) {
    const src = y * width;
    const dst = (y + padPx) * outW + padPx;
    for (let x = 0; x < width; x++) if (mask[src + x]) gray[dst + x] = 0;
  }
  return {
    png: encodeGrayPNG(outW, outH, gray, options.compressionLevel ?? PNG_DEFLATE_LEVEL),
    width: outW,
    height: outH,
  };
}

/**
 * Render one seal (already trimmed to its ink box) at a requested print size.
 * Returns the PNG plus the geometry the caller needs to place it.
 */
function renderStampForSize(entry, sizeCm, opts, padPx) {
  const box = entry.source.bounds;
  const contentPx = Math.max(1, Math.round((sizeCm / 2.54) * opts.dpi));
  const scale = contentPx / Math.max(box.width, box.height);
  const tw = Math.max(1, Math.round(box.width * scale));
  const th = Math.max(1, Math.round(box.height * scale));
  const mask = resampleMask(entry.content, box.width, box.height, tw, th, opts.coverageThreshold);
  const stamp = renderStamp(mask, tw, th, { padPx, compressionLevel: opts.pngCompression });
  return {
    png: stamp.png,
    mask,
    maskW: tw,
    maskH: th,
    widthCm: ((tw + padPx * 2) / opts.dpi) * 2.54,
    heightCm: ((th + padPx * 2) / opts.dpi) * 2.54,
  };
}

/* ------------------------------------------------------------------ *
 * .docx assembly
 * ------------------------------------------------------------------ */

const EMU_PER_CM = 360000;
const TWIPS_PER_CM = 566.9291338582677;

function xmlEscape(value) {
  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function drawingXML(relId, docPrId, name, cx, cy) {
  return (
    `<w:drawing><wp:inline distT="0" distB="0" distL="0" distR="0">` +
    `<wp:extent cx="${cx}" cy="${cy}"/>` +
    `<wp:effectExtent l="0" t="0" r="0" b="0"/>` +
    `<wp:docPr id="${docPrId}" name="${xmlEscape(name)}"/>` +
    `<wp:cNvGraphicFramePr><a:graphicFrameLocks ` +
    `xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" noChangeAspect="1"/>` +
    `</wp:cNvGraphicFramePr>` +
    `<a:graphic xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main">` +
    `<a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture">` +
    `<pic:pic xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture">` +
    `<pic:nvPicPr><pic:cNvPr id="${docPrId}" name="${xmlEscape(name)}"/>` +
    `<pic:cNvPicPr><a:picLocks noChangeAspect="1"/></pic:cNvPicPr></pic:nvPicPr>` +
    `<pic:blipFill><a:blip r:embed="${relId}"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill>` +
    `<pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm>` +
    `<a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr>` +
    `</pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing>`
  );
}

/**
 * Each size group becomes one paragraph of inline images separated by spaces.
 * Word wraps those images to fill the text width, so the seals tile the page
 * and the document uses as few pages as the content allows.
 */
function buildDocumentXML(plan, page) {
  const paragraphs = [];
  for (const group of plan) {
    const runs = [];
    group.items.forEach((item, index) => {
      if (index > 0) {
        runs.push(`<w:r><w:rPr><w:sz w:val="4"/></w:rPr><w:t xml:space="preserve"> </w:t></w:r>`);
      }
      runs.push(`<w:r>${drawingXML(item.relId, item.docPrId, item.name, item.cx, item.cy)}</w:r>`);
    });
    paragraphs.push(
      `<w:p><w:pPr><w:spacing w:before="0" w:after="0" w:line="240" w:lineRule="auto"/>` +
        `<w:jc w:val="left"/></w:pPr>${runs.join("")}</w:p>`,
    );
  }
  const w = Math.round(page.widthCm * TWIPS_PER_CM);
  const h = Math.round(page.heightCm * TWIPS_PER_CM);
  const m = Math.round(page.marginCm * TWIPS_PER_CM);
  const sectPr =
    `<w:sectPr><w:pgSz w:w="${w}" w:h="${h}"/>` +
    `<w:pgMar w:top="${m}" w:right="${m}" w:bottom="${m}" w:left="${m}" ` +
    `w:header="${Math.round(m / 2)}" w:footer="${Math.round(m / 2)}" w:gutter="0"/>` +
    `</w:sectPr>`;
  return (
    `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>` +
    `<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" ` +
    `xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" ` +
    `xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing">` +
    `<w:body>${paragraphs.join("")}${sectPr}</w:body></w:document>`
  );
}

function buildDocx(plan, mediaFiles, page) {
  const relEntries = mediaFiles
    .map(
      (file, index) =>
        `<Relationship Id="rIdImg${index + 1}" ` +
        `Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" ` +
        `Target="media/${xmlEscape(file.name)}"/>`,
    )
    .join("");
  const contentTypes =
    `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>` +
    `<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">` +
    `<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>` +
    `<Default Extension="xml" ContentType="application/xml"/>` +
    `<Default Extension="png" ContentType="image/png"/>` +
    `<Override PartName="/word/document.xml" ` +
    `ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>` +
    `</Types>`;
  const rootRels =
    `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>` +
    `<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">` +
    `<Relationship Id="rId1" ` +
    `Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" ` +
    `Target="word/document.xml"/></Relationships>`;
  const documentRels =
    `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>` +
    `<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">` +
    `${relEntries}</Relationships>`;
  return zipArchive([
    { name: "[Content_Types].xml", data: Buffer.from(contentTypes, "utf8") },
    { name: "_rels/.rels", data: Buffer.from(rootRels, "utf8") },
    { name: "word/document.xml", data: Buffer.from(buildDocumentXML(plan, page), "utf8") },
    { name: "word/_rels/document.xml.rels", data: Buffer.from(documentRels, "utf8") },
    ...mediaFiles.map((file) => ({ name: `word/media/${file.name}`, data: file.data })),
  ]);
}

/* ------------------------------------------------------------------ *
 * Orchestration
 * ------------------------------------------------------------------ */

/**
 * The running catalogue: every seal ever processed through this skill, each one
 * under a number that keeps counting up across runs. The numbers are stable, so
 * "seal 27" means the same image in every conversation and on every sheet.
 *
 * `index` holds one record per stamp (n, file, widthCm, heightCm); the numbered
 * PNGs live beside the document so they can also be found directly on disk.
 */
function buildCatalogDocx(index, catalog, opts) {
  const cols = catalog.perRow ?? 4;
  const textWidthCm = opts.page.widthCm - opts.page.marginCm * 2;
  const colTwips = Math.round((textWidthCm * TWIPS_PER_CM) / cols);
  // An entry may carry attachments: extra images that share its number and sit
  // beside it at the same size, so the group claims extra grid columns.
  const media = [];
  const groups = index.map((entry) => {
    const images = [{
      id: `rIdCat${entry.n}`,
      file: entry.file,
      widthCm: entry.widthCm,
      heightCm: entry.heightCm,
    }];
    (entry.attachments ?? []).forEach((att, k) => {
      images.push({
        id: `rIdAtt${entry.n}_${k + 1}`,
        file: att.file,
        widthCm: att.widthCm,
        heightCm: att.heightCm,
      });
    });
    images.forEach((image) => media.push(image));
    return { n: entry.n, images };
  });

  const emptyCell =
    `<w:tc><w:tcPr><w:tcW w:w="${colTwips}" w:type="dxa"/></w:tcPr><w:p/></w:tc>`;
  const rows = [];
  let cells = [];
  let used = 0;
  let docPrId = 1;
  const flushRow = () => {
    if (!cells.length) return;
    while (used < cols) {
      cells.push(emptyCell);
      used += 1;
    }
    rows.push(`<w:tr><w:trPr><w:cantSplit/></w:trPr>${cells.join("")}</w:tr>`);
    cells = [];
    used = 0;
  };
  for (const group of groups) {
    const span = Math.min(cols, group.images.length);
    if (used + span > cols) flushRow();
    const lines = [];
    for (let i = 0; i < group.images.length; i += span) lines.push(group.images.slice(i, i + span));
    const paragraphs = [
      `<w:p><w:pPr><w:spacing w:before="120" w:after="0" w:line="240" w:lineRule="auto"/></w:pPr>` +
        `<w:r><w:rPr><w:b/><w:sz w:val="24"/></w:rPr><w:t>${group.n}</w:t></w:r></w:p>`,
    ];
    for (const line of lines) {
      const runs = [];
      line.forEach((image, i) => {
        if (i > 0) {
          runs.push(`<w:r><w:rPr><w:sz w:val="4"/></w:rPr><w:t xml:space="preserve"> </w:t></w:r>`);
        }
        runs.push(
          `<w:r>${drawingXML(
            image.id,
            docPrId++,
            image.file,
            Math.round(image.widthCm * EMU_PER_CM),
            Math.round(image.heightCm * EMU_PER_CM),
          )}</w:r>`,
        );
      });
      paragraphs.push(
        `<w:p><w:pPr><w:spacing w:before="0" w:after="0" w:line="240" w:lineRule="auto"/></w:pPr>` +
          `${runs.join("")}</w:p>`,
      );
    }
    cells.push(
      `<w:tc><w:tcPr><w:tcW w:w="${colTwips * span}" w:type="dxa"/>` +
        (span > 1 ? `<w:gridSpan w:val="${span}"/>` : "") +
        `<w:vAlign w:val="top"/></w:tcPr>` +
        `${paragraphs.join("")}</w:tc>`,
    );
    used += span;
  }
  flushRow();
  const borders = ["top", "left", "bottom", "right", "insideH", "insideV"]
    .map((side) => `<w:${side} w:val="none" w:sz="0" w:space="0" w:color="auto"/>`)
    .join("");
  const body =
    `<w:tbl><w:tblPr><w:tblW w:w="${colTwips * cols}" w:type="dxa"/>` +
    `<w:tblLayout w:type="fixed"/><w:tblBorders>${borders}</w:tblBorders>` +
    `<w:tblCellMar><w:top w:w="0" w:type="dxa"/><w:left w:w="57" w:type="dxa"/>` +
    `<w:bottom w:w="0" w:type="dxa"/><w:right w:w="57" w:type="dxa"/></w:tblCellMar>` +
    `</w:tblPr><w:tblGrid>${`<w:gridCol w:w="${colTwips}"/>`.repeat(cols)}</w:tblGrid>` +
    `${rows.join("")}</w:tbl><w:p/>`;

  const w = Math.round(opts.page.widthCm * TWIPS_PER_CM);
  const h = Math.round(opts.page.heightCm * TWIPS_PER_CM);
  const m = Math.round(opts.page.marginCm * TWIPS_PER_CM);
  const sectPr =
    `<w:sectPr><w:pgSz w:w="${w}" w:h="${h}"/>` +
    `<w:pgMar w:top="${m}" w:right="${m}" w:bottom="${m}" w:left="${m}" ` +
    `w:header="${Math.round(m / 2)}" w:footer="${Math.round(m / 2)}" w:gutter="0"/></w:sectPr>`;
  const documentXml =
    `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>` +
    `<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" ` +
    `xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" ` +
    `xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing">` +
    `<w:body>${body}${sectPr}</w:body></w:document>`;

  const relEntries = media
    .map(
      (image) =>
        `<Relationship Id="${image.id}" ` +
        `Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" ` +
        `Target="media/${xmlEscape(image.file)}"/>`,
    )
    .join("");
  const contentTypes =
    `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>` +
    `<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">` +
    `<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>` +
    `<Default Extension="xml" ContentType="application/xml"/>` +
    `<Default Extension="png" ContentType="image/png"/>` +
    `<Default Extension="jpeg" ContentType="image/jpeg"/>` +
    `<Default Extension="jpg" ContentType="image/jpeg"/>` +
    `<Default Extension="gif" ContentType="image/gif"/>` +
    `<Default Extension="bmp" ContentType="image/bmp"/>` +
    `<Override PartName="/word/document.xml" ` +
    `ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>` +
    `</Types>`;
  const rootRels =
    `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>` +
    `<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">` +
    `<Relationship Id="rId1" ` +
    `Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" ` +
    `Target="word/document.xml"/></Relationships>`;
  const documentRels =
    `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>` +
    `<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">` +
    `${relEntries}</Relationships>`;
  return zipArchive([
    { name: "[Content_Types].xml", data: Buffer.from(contentTypes, "utf8") },
    { name: "_rels/.rels", data: Buffer.from(rootRels, "utf8") },
    { name: "word/document.xml", data: Buffer.from(documentXml, "utf8") },
    { name: "word/_rels/document.xml.rels", data: Buffer.from(documentRels, "utf8") },
    ...media.map((image) => ({
      name: `word/media/${image.file}`,
      data: fs.readFileSync(path.join(catalog.dir, image.file)),
    })),
  ]);
}
const DEFAULTS = {
  sizesCm: [1.5, 2, 2.5, 3],
  copies: 3,
  // 300 dpi already captures everything a typical seal scan holds: a 440 px
  // source printed at 3 cm works out to roughly 370 dpi. Higher values mostly
  // interpolate, and cost encode time and file size.
  dpi: 300,
  gapCm: 0.15,
  pngCompression: PNG_DEFLATE_LEVEL,
  trim: true,
  threshold: null,
  coverageThreshold: 0.5,
  despecklePx: 12,
  page: { widthCm: 21, heightCm: 29.7, marginCm: 1.5 },
  order: "seal",
  writeStampFiles: true,
  previewDpi: 100,
  previewPath: null,
};

/**
 * Draw the same page flow the .docx will produce, so the packing density and
 * page count can be eyeballed without opening Word. One PNG per page.
 */
function renderLayoutPreview(plan, options) {
  const dpi = options.previewDpi;
  const toPx = (cm) => Math.round((cm * dpi) / 2.54);
  const pageW = toPx(options.page.widthCm);
  const pageH = toPx(options.page.heightCm);
  const margin = toPx(options.page.marginCm);
  const textW = pageW - margin * 2;
  const textH = pageH - margin * 2;
  const spacePx = Math.max(1, toPx(0.05));
  const pages = [];
  let canvas = new Uint8Array(pageW * pageH).fill(255);
  const nextPage = () => {
    pages.push(canvas);
    canvas = new Uint8Array(pageW * pageH).fill(255);
  };

  let cursorY = margin;
  for (const group of plan) {
    let cursorX = margin;
    let lineH = 0;
    for (const item of group.items) {
      const w = toPx(item.widthCm);
      const h = toPx(item.heightCm);
      if (cursorX > margin && cursorX + w > margin + textW) {
        cursorY += lineH;
        cursorX = margin;
        lineH = 0;
      }
      if (cursorY + h > margin + textH) {
        nextPage();
        cursorY = margin;
        cursorX = margin;
        lineH = 0;
      }
      const xMap = new Int32Array(w);
      for (let x = 0; x < w; x++) {
        const sx = ((x * item.maskW) / w) | 0;
        xMap[x] = sx > item.maskW - 1 ? item.maskW - 1 : sx;
      }
      const yMap = new Int32Array(h);
      for (let y = 0; y < h; y++) {
        const sy = ((y * item.maskH) / h) | 0;
        yMap[y] = sy > item.maskH - 1 ? item.maskH - 1 : sy;
      }
      for (let y = 0; y < h; y++) {
        const srcRow = yMap[y] * item.maskW;
        const dstRow = (cursorY + y) * pageW + cursorX;
        for (let x = 0; x < w; x++) if (item.mask[srcRow + xMap[x]]) canvas[dstRow + x] = 0;
      }
      cursorX += w + spacePx;
      lineH = Math.max(lineH, h);
    }
    cursorY += lineH;
  }
  nextPage();
  return pages.map((page, index) => ({
    page: index + 1,
    width: pageW,
    height: pageH,
    png: encodeGrayPNG(pageW, pageH, page),
  }));
}

/**
 * @param {object}   options
 * @param {string[]} options.images    absolute paths of the seal images
 * @param {string}   options.outDir    directory for the individual stamp PNGs
 * @param {string}   options.docxPath  path of the .docx to write
 * @returns {Promise<object>} summary report
 */
async function run(options) {
  const opts = { ...DEFAULTS, ...options, page: { ...DEFAULTS.page, ...(options.page || {}) } };
  if (!opts.images || !opts.images.length) throw new Error("no input images given");
  if (!opts.outDir) throw new Error("outDir is required");
  fs.mkdirSync(opts.outDir, { recursive: true });

  // Resolve the running catalogue: an explicit value wins and is remembered,
  // otherwise reuse whatever a previous session recorded. Pass `catalog: false`
  // to skip the catalogue for one run without forgetting it.
  let catalog = opts.catalog;
  if (catalog === undefined) {
    catalog = readState().catalog ?? null;
  } else if (catalog) {
    writeState({ ...readState(), catalog });
  } else {
    catalog = null;
  }

  const sizes = opts.sizesCm.slice().sort((a, b) => a - b);
  const report = { images: [], stamps: [], sizesCm: sizes, copies: opts.copies };

  // 1. Binarise every source image once.
  const sources = opts.images.map((file, index) => {
    const png = decodePNG(fs.readFileSync(file));
    const { mask, threshold, usedLuma } = inkMask(png, opts);
    const removed = despeckle(mask, png.width, png.height, opts.despecklePx);
    const box = inkBounds(mask, png.width, png.height);
    if (!box) throw new Error(`no ink found in ${path.basename(file)}`);
    report.images.push({
      file: path.basename(file),
      source: `${png.width}x${png.height}`,
      inkThreshold: threshold,
      thresholdFromLuma: usedLuma,
      specklePixelsRemoved: removed,
      inkBox: box,
      aspect: +(box.width / box.height).toFixed(4),
    });
    return {
      index,
      label: String(index + 1).padStart(2, "0"),
      file,
      mask,
      width: png.width,
      height: png.height,
      bounds: box,
    };
  });

  // 2. Render every seal at every requested print size.
  const padPx = Math.round((opts.gapCm / 2) * (opts.dpi / 2.54));
  const mediaFiles = [];
  const entries = sources.map((source) => ({ source, sizes: {} }));

  for (const entry of entries) {
    const box = entry.source.bounds;
    const content = new Uint8Array(box.width * box.height);
    for (let y = 0; y < box.height; y++) {
      const srcRow = (box.y + y) * entry.source.width + box.x;
      content.set(entry.source.mask.subarray(srcRow, srcRow + box.width), y * box.width);
    }
    entry.content = content;
    for (const sizeCm of sizes) {
      const stamp = renderStampForSize(entry, sizeCm, opts, padPx);
      const file = `seal${entry.source.label}_${String(sizeCm).replace(".", "p")}cm.png`;
      mediaFiles.push({ name: file, data: stamp.png });
      entry.sizes[sizeCm] = {
        file,
        relId: `rIdImg${mediaFiles.length}`,
        cx: Math.round(stamp.widthCm * EMU_PER_CM),
        cy: Math.round(stamp.heightCm * EMU_PER_CM),
        widthCm: stamp.widthCm,
        heightCm: stamp.heightCm,
        mask: stamp.mask,
        maskW: stamp.maskW,
        maskH: stamp.maskH,
        png: stamp.png,
      };
    }
  }

  if (opts.writeStampFiles) {
    for (const file of mediaFiles) fs.writeFileSync(path.join(opts.outDir, file.name), file.data);
  }

  // 3. Build the flow: one paragraph per size, copies spread across seals.
  const plan = sizes.map((sizeCm) => {
    const order = [];
    if (opts.order === "seal") {
      for (const entry of entries) for (let c = 0; c < opts.copies; c++) order.push(entry);
    } else {
      for (let c = 0; c < opts.copies; c++) for (const entry of entries) order.push(entry);
    }
    const items = order.map((entry) => {
      const stamp = entry.sizes[sizeCm];
      return { ...stamp, docPrId: 0, name: stamp.file };
    });
    return { sizeCm, items };
  });
  plan.forEach((group) => group.items.forEach((item, i) => { item.docPrId = i + 1; }));

  // 4. Estimate how many pages the flow occupies.
  const textWidthCm = opts.page.widthCm - opts.page.marginCm * 2;
  const usableHeightCm = opts.page.heightCm - opts.page.marginCm * 2;
  const spaceCm = 0.05;
  let usedCm = 0;
  let pageNumber = 1;
  const pageUsage = [];
  const groups = [];
  for (const group of plan) {
    let index = 0;
    let rows = 0;
    while (index < group.items.length) {
      let rowWidth = 0;
      let rowHeight = 0;
      let count = 0;
      while (index + count < group.items.length) {
        const item = group.items[index + count];
        const w = item.cx / EMU_PER_CM + (count > 0 ? spaceCm : 0);
        if (count > 0 && rowWidth + w > textWidthCm) break;
        rowWidth += w;
        rowHeight = Math.max(rowHeight, item.cy / EMU_PER_CM);
        count++;
      }
      if (usedCm + rowHeight > usableHeightCm) {
        pageUsage.push({ page: pageNumber, usedCm: +usedCm.toFixed(1) });
        pageNumber++;
        usedCm = 0;
      }
      usedCm += rowHeight;
      index += count;
      rows++;
    }
    groups.push({
      sizeCm: group.sizeCm,
      count: group.items.length,
      perRow: Math.max(
        1,
        Math.round(textWidthCm / (group.items[0].cx / EMU_PER_CM + spaceCm)),
      ),
      rows,
    });
  }
  pageUsage.push({ page: pageNumber, usedCm: +usedCm.toFixed(1) });

  // 5. Write the document.
  const docx = buildDocx(plan, mediaFiles, opts.page);
  fs.mkdirSync(path.dirname(opts.docxPath), { recursive: true });
  fs.writeFileSync(opts.docxPath, docx);

  report.docx = {
    path: opts.docxPath,
    bytes: docx.length,
    mediaFiles: mediaFiles.length,
    embeddedStamps: plan.reduce((sum, group) => sum + group.items.length, 0),
    estimatedPages: pageNumber,
    pageUsage,
    groups,
  };

  if (opts.previewPath) {
    const previews = renderLayoutPreview(plan, opts);
    const dir = path.dirname(opts.previewPath);
    fs.mkdirSync(dir, { recursive: true });
    const base = path.basename(opts.previewPath, path.extname(opts.previewPath));
    report.docx.previewFiles = previews.map((item) => {
      const file = path.join(dir, `${base}-p${item.page}.png`);
      fs.writeFileSync(file, item.png);
      return file;
    });
    report.docx.previewPages = previews.length;
  }
  // 6. Append this run's seals to the running catalogue.
  if (catalog && catalog.dir) {
    const catDir = catalog.dir;
    const catSize = catalog.sizeCm ?? sizes[sizes.length - 1];
    fs.mkdirSync(catDir, { recursive: true });
    const indexFile = path.join(catDir, "index.json");
    let index = [];
    if (fs.existsSync(indexFile)) {
      index = JSON.parse(fs.readFileSync(indexFile, "utf8"));
    } else {
      // Recover the numbering from the numbered files if the manifest is gone.
      index = fs
        .readdirSync(catDir)
        .map((name) => /^(\d+)\.(png|jpe?g|gif|bmp)$/i.exec(name))
        .filter(Boolean)
        .map((match) => {
          const file = match[0];
          const buf = fs.readFileSync(path.join(catDir, file));
          const w = buf.readUInt32BE(16);
          const h = buf.readUInt32BE(20);
          const scale = (catSize ?? 3) / Math.max(w, h);
          return {
            n: Number(match[1]),
            file,
            widthCm: +(w * scale).toFixed(4),
            heightCm: +(h * scale).toFixed(4),
          };
        });
    }
    const addedNumbers = [];
    let next = index.reduce((max, item) => Math.max(max, item.n), 0) + 1;

    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 30000);
  }

  async function shareOrSave(bytes, name, mime) {
    if (navigator.share) {
      try {
        const file = new File([bytes], name, { type: mime });
        if (!navigator.canShare || navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file], title: name });
          outHintEl.textContent = "已分享：" + name;
          return;
        }
      } catch (error) {
        if (error && error.name === "AbortError") return; // 用户自己取消了分享
      }
    }
    downloadBytes(bytes, name, mime);
    outHintEl.textContent = "已保存：" + name + "（在“下载 / 文件”里找）";
  }

  el("shareWord").addEventListener("click", () => {
    if (!result) return;
    shareOrSave(result.docx, "印章黑白密排.docx",
      "application/vnd.openxmlformats-officedocument.wordprocessingml.document");
  });
  el("saveZip").addEventListener("click", () => {
    if (!result) return;
    const now = new Date();
    const name = "印章单图_" + now.getFullYear() + pad(now.getMonth() + 1, 2) + pad(now.getDate(), 2) + ".zip";
    shareOrSave(result.stampsZip || zipStamps(result.stamps), name, "application/zip");
  });
  el("savePreview").addEventListener("click", () => {
    if (!result) return;
    shareOrSave(result.preview, "印章排版预览.png", "image/png");
  });
})();
</script>
</body>
</html>
